name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cl-stack-icu4j-test-${{ github.ref }}
  cancel-in-progress: true

env:
  ROSWELL_VERSION: "26.02.116"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED"

jobs:
  test-abcl:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: egao1980/cl-repository/.github/actions/setup-client@main
      - name: Install Roswell
        shell: bash
        run: |
          curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"
      - name: Install ABCL
        shell: bash
        run: |
          ros install abcl-bin
          ros use abcl-bin
      - name: Bootstrap client QL deps
        shell: bash
        run: |
          ros -e '(ql:quickload (quote ("yason" "ironclad" "babel" "dexador" "quri" "chipz" "flexi-streams" "cl-ppcre" "cl-base64" "trivial-features" "salza2" "archive" "bordeaux-threads" "rove" "alexandria" "cl-cookie")) :silent t)' -q

      - name: Fetch ICU4J jar
        shell: bash
        run: |
          mkdir -p lib
          curl -fsSL -o lib/icu4j-78.1.jar \
            https://repo1.maven.org/maven2/com/ibm/icu/icu4j/78.1/icu4j-78.1.jar
          echo "bbb70d3be23110d7295823eee0c2e896ac3b619b3c0f26168f65eb972df51d2a  lib/icu4j-78.1.jar" | sha256sum -c -
      - name: cl-repo install deps
        shell: bash
        run: |
          export CL_SOURCE_REGISTRY="$(pwd)//:$(pwd)/${CL_REPOSITORY_CLIENT_DIR}//:"
          ros -l scripts/ci-install.lisp -q
      - name: Test
        shell: bash
        run: |
          export CL_SOURCE_REGISTRY="$(pwd)//:$(pwd)/${CL_REPOSITORY_CLIENT_DIR}//:"
          ros -l scripts/ci-test.lisp -q
